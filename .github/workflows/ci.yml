name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-eval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package & dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify packaging & static assets
        run: |
          python -c "import hybrid_rag.api as api; assert (api.STATIC_DIR / 'index.html').is_file(), 'Missing static/index.html'"

      - name: Lint with Ruff
        run: ruff check src tests eval

      - name: Run unit & API integration tests
        run: pytest -v

      - name: Run automated RAG evaluation benchmark
        run: python eval/run_eval.py
